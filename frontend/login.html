<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060912" />
  <title>AI English Learning — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#f4f7fc', accent: '#5ba3ff' },
          fontFamily: {
            sans: ['Inter', 'SF Pro Display', 'Segoe UI', 'system-ui', 'sans-serif'],
            display: ['Inter', 'SF Pro Display', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <main class="auth-shell">
    <aside class="auth-visual" aria-hidden="true">
      <div class="mb-6 text-center">
        <p class="brand-mark text-3xl mb-3">AI English Learning</p>
        <p class="text-muted max-w-sm mx-auto">Vocabulary, spaced review, and reading practice — in one calm space.</p>
      </div>
      <div id="auth-orb" class="orb-host"></div>
    </aside>
    <div class="auth-card glass-panel p-7 sm:p-9 fade-up">
      <div class="text-center mb-8">
        <p class="brand-mark text-2xl sm:text-3xl mb-2 leading-tight">AI English Learning</p>
        <h1 class="text-lg font-semibold">Sign in</h1>
        <p class="text-sm text-muted mt-1">Continue your English learning journey</p>
      </div>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label class="input-label" for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            class="input-field"
            autocomplete="email"
            required
            placeholder="you@example.com"
            aria-required="true"
          />
        </div>
        <div>
          <label class="input-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="input-field"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            aria-required="true"
          />
        </div>
        <button id="login-submit" type="submit" class="btn btn-primary w-full btn-lg mt-2">
          Sign in
        </button>
      </form>

      <p class="text-center text-sm text-muted mt-6">
        New here?
        <a href="register.html" class="font-semibold no-underline hover:underline">Create an account</a>
      </p>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
