<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiFlow — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            skyglass: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd' },
            mintglass: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4' },
            ink: '#0b1f33',
          },
          fontFamily: {
            sans: ['Nunito Sans', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            display: ['Nunito Sans', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <main class="auth-shell">
    <div class="auth-card glass-panel p-7 sm:p-9 fade-up">
      <div class="text-center mb-8">
        <p class="brand-mark text-3xl text-[var(--ink)] mb-2">LexiFlow</p>
        <h1 class="text-lg font-semibold text-[var(--ink)]">Sign in</h1>
        <p class="text-sm text-muted mt-1">Continue your English learning journey</p>
      </div>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label class="input-label" for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            class="input-field"
            autocomplete="email"
            required
            placeholder="you@example.com"
            aria-required="true"
          />
        </div>
        <div>
          <label class="input-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="input-field"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            aria-required="true"
          />
        </div>
        <button id="login-submit" type="submit" class="btn btn-primary w-full btn-lg mt-2">
          Sign in
        </button>
      </form>

      <p class="text-center text-sm text-muted mt-6">
        New here?
        <a href="register.html" class="font-semibold text-[var(--teal-600)] no-underline hover:underline">Create an account</a>
      </p>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
