<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiFlow — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

            mintglass: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4' },

            sans: ['Nunito Sans', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],

        },
      },
    };

  <link rel="stylesheet" href="css/app.css" />

<body>
  <div id="app-root" class="page-shell">
    <div id="app-nav"></div>
    <main class="page-main max-w-3xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10">
      <div id="profile-root" aria-live="polite"></div>

    <div id="bottom-nav"></div>
