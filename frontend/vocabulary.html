<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiFlow — Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            skyglass: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd' },
            mintglass: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4' },
            ink: '#0b1f33',
          },
          fontFamily: {
            sans: ['Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            display: ['Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app-root" class="page-shell">
    <div id="app-nav"></div>
    <main class="page-main max-w-5xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10">
      <header class="mb-6 fade-up">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p class="text-sm font-semibold text-[var(--teal-600)]">Vocabulary</p>
            <h1 class="font-display text-3xl font-semibold">Your words</h1>
          </div>
          <p id="vocab-count" class="text-sm text-muted" aria-live="polite"></p>
        </div>
      </header>

      <section class="glass-panel p-4 sm:p-5 mb-5 fade-up" aria-label="Add word by text">
        <form id="add-by-text-form" class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
          <div class="flex-1">
            <label class="input-label" for="add-word-text">Add word by typing</label>
            <input
              id="add-word-text"
              name="wordText"
              type="text"
              class="input-field"
              placeholder="e.g. serene"
              autocomplete="off"
              aria-describedby="add-word-hint"
            />
            <p id="add-word-hint" class="text-xs text-muted mt-1.5">Looks up definition and adds to your vocabulary.</p>
          </div>
          <button id="add-word-btn" type="submit" class="btn btn-primary shrink-0">Add word</button>
        </form>
      </section>

      <section class="mb-4 fade-up" aria-label="Search and filters">
        <label class="input-label" for="vocab-search">Search</label>
        <input
          id="vocab-search"
          type="search"
          class="input-field mb-3"
          placeholder="Search your vocabulary…"
          autocomplete="off"
        />
        <div class="flex flex-wrap gap-2" role="group" aria-label="Status filters">
          <button type="button" class="filter-chip is-active" data-status-filter="">All</button>
          <button type="button" class="filter-chip" data-status-filter="New">New</button>
          <button type="button" class="filter-chip" data-status-filter="Learning">Learning</button>
          <button type="button" class="filter-chip" data-status-filter="Known">Known</button>
          <button type="button" class="filter-chip" data-status-filter="Mastered">Mastered</button>
        </div>
      </section>

      <div id="vocab-list" aria-live="polite"></div>
    </main>
    <div id="bottom-nav"></div>
  </div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <script type="module" src="js/pages/vocabulary.js"></script>
</body>
</html>
