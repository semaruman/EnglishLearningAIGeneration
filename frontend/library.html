<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060912" />
  <title>AI English Learning — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#f4f7fc', accent: '#5ba3ff' },
          fontFamily: {
            sans: ['Inter', 'SF Pro Display', 'Segoe UI', 'system-ui', 'sans-serif'],
            display: ['Inter', 'SF Pro Display', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app-root" class="page-shell">
    <div id="app-nav"></div>
    <main class="page-main mx-auto px-4 sm:px-6 pt-4 sm:pt-8">
      <header class="mb-6 fade-up">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p class="section-eyebrow">Library</p>
            <h1 class="font-display text-3xl font-semibold">Word library</h1>
            <p class="text-muted text-sm mt-1">Browse the global dictionary and add words to your vocabulary.</p>
          </div>
          <p id="library-count" class="text-sm text-muted" aria-live="polite"></p>
        </div>
      </header>

      <section class="mb-5 fade-up">
        <label class="input-label" for="library-search">Search words</label>
        <input
          id="library-search"
          type="search"
          class="input-field"
          placeholder="Search by word text…"
          autocomplete="off"
        />
      </section>

      <div id="library-list" aria-live="polite"></div>
    </main>
    <div id="bottom-nav"></div>
  </div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <script type="module" src="js/pages/library.js"></script>
</body>
</html>
